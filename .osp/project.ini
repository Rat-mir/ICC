[icc.local]
project_enabled = on
project_root = {base_dir}
web_root = {base_dir}\client
http_engine = Apache
php_engine = PHP-8.4
node_engine = auto
http_port = 80
https_port = 443
tls_enabled = on
tls_cert_file = auto
tls_key_file = auto
bind_ip = auto
environment = System
primary_domain = on
server_aliases =
project_category = ICC
terminal_codepage = 65001

[api.icc.local]
project_enabled = on
project_root = {base_dir}
web_root = {base_dir}\public
http_engine = Apache
php_engine = PHP-8.4
node_engine = auto
http_port = 80
https_port = 443
tls_enabled = on
tls_cert_file = auto
tls_key_file = auto
bind_ip = auto
environment = System
primary_domain = off
server_aliases =
project_category = ICC
terminal_codepage = 65001
