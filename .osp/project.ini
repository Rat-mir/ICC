[icc.local]

bind_ip           = auto
environment       = System
http_engine       = Apache
http_port         = 80
https_port        = 443
node_engine       = auto
php_engine        = PHP-8.4
primary_domain    = on
project_category  = ICC
project_enabled   = on
project_root      = {base_dir}
server_aliases    =
terminal_codepage = 65001
tls_cert_file     = auto
tls_enabled       = on
tls_key_file      = auto
web_root          = {base_dir}\client

[api.icc.local]

bind_ip           = auto
environment       = System
http_engine       = Apache
http_port         = 80
https_port        = 443
node_engine       = auto
php_engine        = PHP-8.4
primary_domain    = off
project_category  = ICC
project_enabled   = on
project_root      = {base_dir}
server_aliases    =
terminal_codepage = 65001
tls_cert_file     = auto
tls_enabled       = on
tls_key_file      = auto
web_root          = {base_dir}\public
